# A workflow progress tree, rendered inline in the transcript.
#
# The harness already reconstructs workflow runs as chat nodes
# (dsh-client-ui-workflow-run). That node shows name, phase, member identity
# and status; this one adds what a run in flight is actually asked about —
# durations, live elapsed, progress counts, and the reason a member failed —
# by folding the same four tool-workflow/* events and keeping event.time.
#
# The stock node is suppressed rather than left to render alongside, so one
# run does not appear twice.
#
# Host half is a stub: everything is browser-side. The row exists to qualify
# the package for the client roster.
- insert:
    - id: workflow-view
      name: '@my-dsh/workflow'
