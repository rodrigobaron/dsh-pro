# The contained reader behind GET /canvas/file, which the panel fetches
# envelopes and image/PDF bytes from. It lives in the web profile because it
# needs `webServer`; the `show_file` tool half is an agent-preset row instead
# (agent.preset.yml), because `tools` is a different Cordis context.
- insert:
    - id: host-file-canvas-route
      name: '@my-dsh/tool-file-canvas/route'
